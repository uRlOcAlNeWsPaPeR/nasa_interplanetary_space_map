<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interplanetary Survival Guide: Martian Map</title>
  <style>
    :root {
      --bg: #14100e;
      --panel: #211a17;
      --line: #3a2e28;
      --text: #f1e7df;
      --muted: #a8978b;
      --accent: #e0703a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 290px;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    aside h2 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #map-wrap { position: relative; }
    #map-stage { position: relative; overflow: hidden; border-radius: 8px; }
    #map-zoom { position: relative; transform-origin: 0 0; }
    #map-wrap.is-3d #map-zoom { display: none; }
    #map.is-zoomed { cursor: grab; }

    /* Live risk indicator, top-right of the map. */
    #risk-hud {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 190px;
      padding: 8px 10px;
      background: rgba(20, 16, 14, .85);
      border: 1px solid var(--risk, var(--line));
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
    #risk-hud[hidden] { display: none; }
    .risk-head { display: flex; justify-content: space-between; color: var(--muted); }
    .risk-head strong { color: var(--risk); }
    .risk-bar { height: 6px; margin: 6px 0; background: var(--line); border-radius: 3px; overflow: hidden; }
    .risk-bar span { display: block; height: 100%; background: var(--risk); transition: width .3s ease, background-color .3s ease; }
    #risk-cause { color: var(--muted); }

    /* Route and rover keys in the map legend. */
    #map-legend-routes { display: grid; gap: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
    .map-legend-row.is-off { opacity: .55; }
    .route-line {
      display: inline-block;
      width: 18px;
      height: 3px;
      flex: none;
      background: var(--rc);
      border-radius: 2px;
      box-shadow: 0 0 0 1px #14100e;
    }
    .legend-rover {
      width: 14px;
      height: 11px;
      flex: none;
      background: #f1e7df;
      clip-path: polygon(100% 50%, 0 0, 22% 50%, 0 100%);
    }
    .legend-dest {
      width: 12px;
      height: 12px;
      flex: none;
      border: 2px solid #ffd166;
      border-radius: 50%;
    }

    /* Route option cards. */
    .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
    .hint { margin: 4px 0 8px; color: var(--muted); font-size: 12px; }
    .hint:empty { display: none; }
    #route-options { display: grid; gap: 8px; margin: 10px 0 12px; }
    .route-card {
      display: grid;
      gap: 3px;
      position: relative;
      padding: 8px 10px 8px 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }
    .route-card:hover { border-color: var(--muted); }
    .route-card.is-selected { border-color: var(--rc); background: rgba(255, 255, 255, .03); }
    .route-card input { position: absolute; left: 9px; top: 10px; margin: 0; accent-color: var(--rc); }
    .route-head { display: flex; align-items: center; gap: 8px; }
    .route-head .route-line { --rc: inherit; }
    .badge {
      margin-left: auto;
      padding: 1px 6px;
      font-size: 11px;
      font-style: normal;
      color: #14100e;
      background: var(--rc);
      border-radius: 10px;
    }
    .route-goal, .route-stats { color: var(--muted); font-size: 12px; }
    .route-stats { color: var(--text); font-variant-numeric: tabular-nums; }
    .route-points { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12px; }
    .route-points li { padding-left: 14px; position: relative; }
    .route-points li::before { position: absolute; left: 0; }
    .route-points .pro::before { content: "+"; color: #5fd08a; }
    .route-points .con::before { content: "\2212"; color: #ff8a7a; }
    .recommend { margin: 0 0 10px; padding: 8px 10px; border-left: 3px solid #7dffa0; background: rgba(125, 255, 160, .06); font-size: 12px; }
    #route-summary h3 { margin: 12px 0 6px; font-size: 13px; }
    .concerns { margin: 0; padding-left: 16px; font-size: 12px; }
    .concerns li { margin-bottom: 4px; }

    /* Rover panel. */
    .mode-toggle { display: flex; margin-bottom: 10px; }
    .mode-toggle button { flex: 1; margin: 0; }
    #rover-panel.is-manual .auto-only, #rover-panel:not(.is-manual) .manual-only { display: none; }
    .full { width: 100%; margin: 10px 0 0; }
    .button-row { display: flex; gap: 6px; }
    .button-row button { margin-top: 10px; white-space: nowrap; }
    .button-row .primary { flex: 2; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #14100e; font-weight: 600; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .drive-pad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 36px);
      gap: 4px;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }
    .drive-pad button { margin: 0; padding: 0; }
    .drive-pad button:active { background: var(--accent); color: #14100e; }
    .pad-up { grid-column: 2; grid-row: 1; }
    .pad-left { grid-column: 1; grid-row: 2; }
    .pad-down { grid-column: 2; grid-row: 2; }
    .pad-right { grid-column: 3; grid-row: 2; }
    .rover-row button { margin: 0; flex: 1; }
    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 8px;
    }
    .map-toolbar button { width: auto; margin: 0; padding: 4px 12px; }
    .view-toggle { display: inline-flex; }
    .view-toggle button { border-radius: 0; }
    .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
    .view-toggle button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    .view-toggle button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #14100e; font-weight: 600; }
    .view-toggle button:disabled { opacity: .45; cursor: not-allowed; }
    .map-hint { color: var(--muted); font-size: 12px; }
    #map-3d { display: none; }
    #map-wrap.is-3d #map-3d { display: block; }
    #map-3d canvas {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: grab;
    }
    #map-3d canvas.on-terrain { cursor: crosshair; }
    .rover-controls { display: flex; gap: 6px; }
    .rover-controls button { margin: 0; padding: 6px 4px; }
    #rover-follow[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .rover-row :disabled { opacity: .45; cursor: not-allowed; }
    .rover-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    .rover-row input[type="range"] { flex: 1; min-width: 0; }
    .rover-row select {
      padding: 3px 4px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    #rover-2d {
      position: absolute;
      width: 18px;
      height: 14px;
      pointer-events: none;
      background: #f1e7df;
      clip-path: polygon(100% 50%, 0 0, 22% 50%, 0 100%);
      filter: drop-shadow(0 0 2px #14100e) drop-shadow(0 0 1px #14100e);
    }
    #rover-2d[hidden] { display: none; }
    #map {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: crosshair;
    }
    #hover-readout {
      margin-top: 6px;
      min-height: 1.45em;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .layer-row, .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .layer-row label { display: flex; align-items: center; gap: 8px; flex: 1; }
    input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }
    .layer-row input[type="range"] { width: 64px; flex: none; }
    .hazard-row { padding: 4px 0; }
    .hazard-row input[type="range"] { width: 100%; margin: 4px 0 0; }
    .hazard-head { display: flex; justify-content: space-between; }
    .hazard-head > span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .hazard-name { display: flex; align-items: center; gap: 8px; }
    .hazard-row.is-on .hazard-head > span:last-child { color: var(--hz); font-weight: 600; }

    /* Each hazard swatch shows its color AND its map texture. */
    .hazard-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      vertical-align: -2px;
      border-radius: 3px;
      border: 2px solid var(--hz);
      flex: none;
    }
    .hazard-name .hazard-swatch { margin-right: 0; }
    .hazard-swatch--hatch {
      background: repeating-linear-gradient(45deg, var(--hz) 0 2px, transparent 2px 5px);
    }
    .hazard-swatch--particles {
      background: radial-gradient(circle, var(--hz) 1px, transparent 1.5px) 0 0 / 4px 4px;
    }
    dd.over { color: var(--hz); font-weight: 600; }

    #map-fx {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    #map-legend {
      position: absolute;
      top: 10px;
      left: 10px;
      display: grid;
      gap: 6px;
      padding: 8px 10px;
      max-width: calc(100% - 20px);
      background: rgba(20, 16, 14, .82);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
    #map-legend #map-legend-hazards { display: grid; gap: 6px; }
    .map-legend-row { display: flex; align-items: center; gap: 8px; }
    .map-legend-row .hazard-swatch { margin-right: 0; }
    .map-legend-row span { color: var(--muted); }
    .map-legend-row strong { color: var(--text); font-weight: 600; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 6px 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .side { display: grid; gap: 16px; }
    aside dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
    aside dt { color: var(--muted); }
    aside dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    aside .site { margin: 0 0 10px; font-weight: 600; }
    aside .empty { color: var(--muted); margin: 0; }
    .field { display: grid; gap: 4px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .field select {
      width: 100%;
      padding: 5px 6px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Interplanetary Survival Guide: Martian Map</h1>
  </header>
  <main>
    <aside id="layer-panel">
      <h2>Layers</h2>
      <div id="layer-list"></div>
      <button id="reset-layers" type="button">Reset layers</button>
      <div class="section">
        <h2>Highlight hazards</h2>
        <div id="hazard-list"></div>
      </div>
      <div id="site-legend" class="section"></div>
    </aside>
    <section id="map-wrap">
      <div class="map-toolbar">
        <div class="view-toggle" role="group" aria-label="Map view">
          <button type="button" data-view="3d">3D</button>
          <button type="button" data-view="2d">2D</button>
        </div>
        <div class="view-toggle" role="group" aria-label="Zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        </div>
        <button id="reset-view" type="button">Reset view</button>
        <span id="map-hint" class="map-hint"></span>
      </div>
      <div id="map-stage">
        <div id="map-zoom">
          <canvas id="map" width="720" height="540"></canvas>
          <canvas id="map-fx" width="720" height="540" aria-hidden="true"></canvas>
          <div id="rover-2d" hidden aria-hidden="true"></div>
        </div>
        <div id="map-3d"></div>
        <div id="map-legend">
          <div id="map-legend-hazards"></div>
          <div id="map-legend-routes"></div>
        </div>
        <div id="risk-hud" hidden>
          <div class="risk-head">Rover risk <strong id="risk-level"></strong></div>
          <div class="risk-bar"><span id="risk-fill"></span></div>
          <div id="risk-cause"></div>
        </div>
      </div>
      <div id="hover-readout"></div>
    </section>
    <div class="side">
      <aside id="info-panel">
        <h2>Sample</h2>
        <div id="info-body"></div>
        <div class="button-row">
          <button id="send-rover" type="button" class="primary" disabled>Send rover here</button>
          <button id="clear-sample" type="button">Clear</button>
        </div>
      </aside>
      <aside id="rover-panel">
        <h2>Rover</h2>
        <div class="view-toggle mode-toggle" role="group" aria-label="Driving mode">
          <button id="mode-auto" type="button" aria-pressed="true">Auto</button>
          <button id="mode-manual" type="button" aria-pressed="false">Manual</button>
        </div>
        <div class="auto-only">
          <div class="rover-controls">
            <button id="rover-play" type="button" class="primary">Drive</button>
            <button id="rover-restart" type="button">Restart</button>
          </div>
          <input id="rover-progress" class="full" type="range" min="0" max="1000" value="0" aria-label="Rover progress along route">
        </div>
        <div class="manual-only">
          <div class="drive-pad" aria-label="Drive controls">
            <button type="button" data-drive="up" class="pad-up" aria-label="Forward">&#9650;</button>
            <button type="button" data-drive="left" class="pad-left" aria-label="Turn left">&#9664;</button>
            <button type="button" data-drive="down" class="pad-down" aria-label="Reverse">&#9660;</button>
            <button type="button" data-drive="right" class="pad-right" aria-label="Turn right">&#9654;</button>
          </div>
          <p class="hint">Hold the buttons, or use W A S D / arrow keys. Press Auto to plan a route from here.</p>
        </div>
        <div class="rover-row">
          <button id="rover-follow" type="button" aria-pressed="false">Follow cam</button>
          <select id="rover-speed" aria-label="Rover speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <div id="rover-telemetry"></div>
      </aside>
      <aside id="route-panel">
        <h2>Navigation</h2>
        <label class="field">Start site <select id="route-from"></select></label>
        <label class="field">Destination <select id="route-to"></select></label>
        <label class="check"><input id="route-avoid" type="checkbox" checked> Avoid highlighted hazard zones</label>
        <p id="route-avoid-note" class="hint"></p>
        <div id="route-options"></div>
        <div id="route-summary"></div>
      </aside>
    </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="mock-data.js"></script>
  <script src="ui.js"></script>
  <script src="rover.js"></script>
</body>
</html>
