<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interplanetary Survival Guide: Martian Map</title>
  <style>
    /* Theme from ridgeback-rover-3d.html, light and dark. */
    :root {
      color-scheme: light;
      --panel: rgba(242, 245, 247, .94);
      --text: #14202b;
      --muted: #4e6272;
      --line: #c5d0d8;
      --accent: #1f5f8b;
      --on-accent: #ffffff;
      --ok: #2f7d4f;
      --warn: #a86a00;
      --bad: #b3261e;
      --btn: #dfe8ee;
      --sky: #d9a47c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --panel: rgba(18, 26, 34, .92);
        --text: #e6eef4;
        --muted: #9fb3c2;
        --line: #2d3d4a;
        --accent: #7cc4ec;
        --on-accent: #0d1720;
        --ok: #6fcf97;
        --warn: #f2c46d;
        --bad: #ff8a80;
        --btn: #1d2a35;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --panel: rgba(18, 26, 34, .92);
      --text: #e6eef4;
      --muted: #9fb3c2;
      --line: #2d3d4a;
      --accent: #7cc4ec;
      --on-accent: #0d1720;
      --ok: #6fcf97;
      --warn: #f2c46d;
      --bad: #ff8a80;
      --btn: #1d2a35;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--sky);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* ---- the world (main view) ---- */
    #world { position: fixed; inset: 0; }
    #world canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #world canvas:active { cursor: grabbing; }
    #world.no-3d { display: grid; place-items: center; padding: 24px; text-align: center; }

    /* ---- overlay columns ---- */
    .column {
      position: fixed;
      top: 12px;
      display: grid;
      align-content: start;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      pointer-events: none;
    }
    .column > * { pointer-events: auto; min-width: 0; }
    .column { overflow-x: hidden; }
    #hud-left { left: 12px; width: 280px; max-height: calc(100vh - 290px); }
    #hud-right { right: 12px; width: 310px; max-height: calc(100vh - 170px); }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }

    /* ---- right-hand tabs: one panel at a time ---- */
    #tabs { display: flex; gap: 4px; padding: 5px; border-radius: 12px; }
    #tabs button {
      flex: 1;
      padding: 7px 4px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }
    #tabs button:hover { color: var(--text); background: var(--btn); }
    #tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
    #hud-right details.card > summary { display: none; }
    #hud-right details.card:not([open]) { display: none; }
    .tab-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .tab-head h2 { margin: 0; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--text); }

    /* ---- "?" help buttons (help.js) ---- */
    .help-btn {
      flex: none !important;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      color: var(--muted);
      align-self: center;
    }
    .help-btn[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .help-pop {
      margin: 8px 0 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      background: var(--btn);
      font-size: 12px;
    }
    .help-pop[hidden] { display: none; }
    .help-pop dl { display: block; }
    .help-pop dt { color: var(--text); font-weight: 600; }
    .help-pop dd { text-align: left; margin: 0 0 6px; color: var(--muted); }
    .help-pop dd:last-child { margin-bottom: 0; }

    /* ---- fold-away extras ("More readings", route details, learn more) ---- */
    details.more { margin-top: 10px; font-size: 12px; }
    details.more > summary {
      cursor: pointer;
      color: var(--muted);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary::before { content: "\25B8"; font-size: 10px; transition: transform .15s; }
    details.more[open] > summary::before { transform: rotate(90deg); }
    details.more > summary:hover { color: var(--text); }
    details.more[open] > summary { margin-bottom: 8px; }
    .learn { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
    .learn details.more { margin-top: 4px; }
    .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #rover-telemetry { margin-top: 4px; }
    details.card > summary {
      cursor: pointer;
      font-weight: 600;
      list-style: none;
      display: flex;
      justify-content: space-between;
    }
    details.card > summary::after { content: "+"; color: var(--muted); }
    details.card[open] > summary::after { content: "\2212"; }
    details.card[open] > summary { margin-bottom: 10px; }
    h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h3 { margin: 12px 0 6px; font-size: 13px; }
    .section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }

    /* ---- Ridgeback card ---- */
    #rb-card h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .tag { display: none; }
    #rb-card h1 { margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    #rb-battery-label { cursor: help; border-bottom: 1px dotted var(--muted); }
    .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
    #rb-fill { height: 100%; width: 100%; transition: width .15s, background-color .3s; }
    #rb-fill.ok { background: var(--ok); }
    #rb-fill.warn { background: var(--warn); }
    #rb-fill.bad { background: var(--bad); }
    #rb-status { font-size: 13px; margin: 10px 0 4px; min-height: 2.8em; }
    #rb-limit { font-size: 12px; margin: 0 0 4px; color: var(--warn); font-weight: 600; }
    #rb-hint { font-size: 12px; margin: 0 0 8px; color: var(--muted); }
    #rb-limit:empty, #rb-hint:empty { display: none; }
    #rb-limits { margin: 0; padding-left: 18px; }
    #rb-power { max-height: 40vh; overflow-y: auto; padding-right: 4px; }
    #rb-power p { margin: 6px 0; color: var(--muted); }
    #rb-power h3 { margin: 10px 0 4px; font-size: 12px; }
    #rb-power ul { margin: 0; padding-left: 18px; }
    #rb-power li { margin-bottom: 4px; }
    #rb-power a { color: var(--muted); font-size: 11px; white-space: nowrap; }

    /* ---- controls ---- */
    button {
      font: inherit;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .button-row { display: flex; gap: 6px; margin-top: 10px; }
    .button-row button { flex: 1; white-space: nowrap; }
    .button-row .primary { flex: 2; }
    select {
      width: 100%;
      padding: 5px 6px;
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }
    .field { display: grid; gap: 4px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
    .hint { margin: 4px 0 8px; color: var(--muted); font-size: 12px; }
    .hint:empty { display: none; }
    .toggle { display: flex; }
    .toggle button { flex: 1; border-radius: 0; }
    .toggle button:first-child { border-radius: 8px 0 0 8px; }
    .toggle button:last-child { border-radius: 0 8px 8px 0; border-left: none; }
    .toggle button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

    /* ---- data lists ---- */
    dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    dd.over { color: var(--hz); font-weight: 600; }
    .site { margin: 0 0 8px; font-weight: 600; }
    .empty { color: var(--muted); margin: 0; font-size: 13px; }

    /* ---- layers and hazards ---- */
    .legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    /* Layers: each one a card with its colour scale; lit up when it's on. */
    #layer-list { display: grid; gap: 6px; }
    .layer-row {
      display: grid;
      grid-template-columns: 1fr 84px;
      grid-template-areas: "label label" "ramp slider";
      align-items: center;
      gap: 6px 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--btn);
      transition: border-color .15s, box-shadow .15s;
    }
    .layer-row.is-on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .layer-row:not(.is-on) .layer-ramp, .layer-row:not(.is-on) input[type="range"] { opacity: .4; }
    .layer-row label { grid-area: label; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .layer-name { font-weight: 600; }
    .layer-row:not(.is-on) .layer-name { font-weight: 500; color: var(--muted); }
    .layer-ramp { grid-area: ramp; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
    .layer-row input[type="range"] { grid-area: slider; width: 100%; margin: 0; }

    /* Layers / Hazards tabs on the left card (same look as the right tabs). */
    .tabs { display: flex; gap: 4px; padding: 4px; margin: -6px -8px 12px; border-radius: 10px; background: var(--btn); }
    .tabs button { flex: 1; padding: 6px 4px; border: none; border-radius: 7px; background: transparent; color: var(--muted); font-weight: 600; }
    .tabs button:hover { color: var(--text); }
    .tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
    #layers-pane[hidden], #hazards-pane[hidden] { display: none; }
    .hazard-row { padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-left: 4px solid var(--hz); border-radius: 10px; background: var(--btn); }
    .hazard-row input[type="range"] { width: 100%; margin: 4px 0 0; }
    .hazard-head { display: flex; justify-content: space-between; }
    .hazard-head > span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .hazard-row.is-on .hazard-head > span:last-child { color: var(--hz); font-weight: 600; filter: brightness(.8); }
    .hazard-name { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    /* Each hazard swatch shows its colour AND its ground texture. */
    .hazard-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      vertical-align: -2px;
      border-radius: 3px;
      border: 2px solid var(--hz);
      flex: none;
    }
    .hazard-name .hazard-swatch, .map-legend-row .hazard-swatch { margin-right: 0; }
    .hazard-swatch--hatch { background: repeating-linear-gradient(45deg, var(--hz) 0 2px, transparent 2px 5px); }
    .hazard-swatch--particles { background: radial-gradient(circle, var(--hz) 1px, transparent 1.5px) 0 0 / 4px 4px; }
    #map-legend { display: grid; gap: 6px; font-size: 12px; }
    #map-legend-hazards, #map-legend-routes { display: grid; gap: 6px; }
    #map-legend-routes { padding-top: 6px; border-top: 1px solid var(--line); }
    .map-legend-row { display: flex; align-items: center; gap: 8px; }
    .map-legend-row.is-off { opacity: .55; }
    .map-legend-row span { color: var(--muted); }
    .map-legend-row strong { color: var(--text); font-weight: 600; }
    .route-line {
      display: inline-block;
      width: 18px;
      height: 4px;
      flex: none;
      background: var(--rc);
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .55);
    }
    .legend-rover {
      width: 14px;
      height: 11px;
      flex: none;
      background: #ffffff;
      clip-path: polygon(100% 50%, 0 0, 22% 50%, 0 100%);
      filter: drop-shadow(0 0 1px #000);
    }
    .legend-dest { width: 12px; height: 12px; flex: none; border: 2px solid #e0a800; border-radius: 50%; }

    /* ---- data provenance: observed / computed / simulated ---- */
    .kind {
      display: inline-block;
      margin-left: 6px;
      padding: 0 5px;
      font-size: 9px;
      line-height: 1.45;
      letter-spacing: .03em;
      border: 1px solid currentColor;
      border-radius: 4px;
      vertical-align: 1px;
      white-space: nowrap;
    }
    .kind--observed { color: var(--ok); }
    .kind--computed { color: var(--accent); }
    .kind--simulated { color: var(--warn); }
    .layer-status { margin-left: 6px; font-size: 11px; color: var(--muted); }
    .error { margin: 0 0 8px; color: var(--bad); font-size: 12px; }
    #data-sources { font-size: 12px; }
    #data-sources p { margin: 0 0 8px; }
    #data-sources h3 { margin: 10px 0 6px; font-size: 12px; }
    .provenance, .sources { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
    .provenance .kind { margin: 0 4px 0 0; }
    .sources a { color: var(--accent); }

    /* ---- Perseverance images in the Inspect panel ---- */
    .shots { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .shots h3 { margin: 0 0 4px; }
    .shot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 6px 0; }
    .shot-grid a { display: grid; gap: 2px; color: var(--muted); font-size: 10px; text-decoration: none; }
    .shot-grid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--line); }
    .shot-grid a.is-broken img { visibility: hidden; }

    /* ---- live risk indicator ---- */
    #risk-hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      padding: 8px 12px;
      background: var(--panel);
      border: 2px solid var(--risk, var(--line));
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
    }
    #risk-hud[hidden] { display: none; }
    /* The no-route notice. */
    .app-dialog {
      max-width: 380px;
      width: calc(100% - 32px);
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
    }
    .app-dialog::backdrop { background: rgba(5, 8, 12, .55); }
    .app-dialog h2 { margin: 0 0 8px; font-size: 17px; color: var(--text); text-transform: none; letter-spacing: 0; }
    .app-dialog > p { margin: 0 0 12px; font-size: 13px; line-height: 1.45; }
    .app-dialog .button-row { margin-top: 14px; justify-content: flex-end; }
    .choice-delete { width: 100%; margin-top: 8px; color: var(--bad); }
    /* Walk or Drive popup next to the double-clicked point (ui.js). */
    #choice-popup {
      position: fixed;
      z-index: 40;
      width: 230px;
      padding: 12px 14px;
    }
    #choice-popup[hidden] { display: none; }
    #choice-title { margin: 0 22px 10px 0; font-size: 13px; font-weight: 600; }
    #choice-popup .button-row { margin: 0; }
    #choice-popup .button-row button { flex: 1; }
    #choice-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      padding: 0;
      line-height: 1;
      font-size: 16px;
    }
    /* Battery warnings at 20% / 10% / 5% (rover.js): a notice at the bottom. */
    .battery-warning {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(460px, calc(100vw - 32px));
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel);
      border: 2px solid var(--bw);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    .battery-warning[hidden] { display: none; }
    .battery-warning-text { flex: 1; font-size: 13px; line-height: 1.35; }
    .battery-warning-text strong { display: block; font-size: 15px; color: var(--bw); }
    .battery-warning button { flex: none; }
    #battery-warning-close { width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
    .battery-warning--20 { --bw: #f2a516; }
    .battery-warning--10 { --bw: #ff7a1a; }
    .battery-warning--5 { --bw: #ff4d3d; animation: battery-warn-pulse 1s ease-in-out infinite alternate; }
    @keyframes battery-warn-pulse {
      from { box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
      to { box-shadow: 0 0 28px 8px rgba(255, 77, 61, .55); }
    }
    @media (prefers-reduced-motion: reduce) {
      .battery-warning--5 { animation: none; }
    }
    @media (max-width: 560px) {
      .battery-warning { bottom: auto; top: 64px; }
    }
    /* Battery empty (rover.js): pulses slowly (well under 3 flashes a second),
       and holds still for people who ask for reduced motion. */
    #battery-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      width: min(360px, calc(100vw - 32px));
      padding: 18px 20px;
      text-align: center;
      color: #ffffff;
      background: rgba(150, 20, 20, .92);
      border: 2px solid #ff5a4f;
      border-radius: 14px;
      animation: battery-flash 1s ease-in-out infinite alternate;
    }
    #battery-alert[hidden] { display: none; }
    #battery-alert h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: #ffffff; }
    #battery-alert p { margin: 0 0 14px; font-size: 14px; line-height: 1.4; }
    #battery-alert button { background: #ffffff; border-color: #ffffff; color: #8f1410; font-weight: 700; }
    @keyframes battery-flash {
      from { background: rgba(110, 12, 12, .9); box-shadow: 0 0 0 0 rgba(255, 90, 79, 0); }
      to { background: rgba(214, 38, 30, .96); box-shadow: 0 0 40px 12px rgba(255, 90, 79, .55); }
    }
    @media (prefers-reduced-motion: reduce) {
      #battery-alert { animation: none; }
    }
    /* Colour-coded hazard warning (rover.js): filled = Ridgeback can't drive
       there, outlined = risky ground; the colour matches the map highlight. */
    .hazard-warning {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }
    .hazard-warning[hidden] { display: none; }
    .hazard-warning--danger { background: var(--hz); color: #0d1117; }
    .hazard-warning--caution { border: 2px solid var(--hz); color: var(--text); }
    .sand-distance {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      text-align: center;
      background: rgba(196, 140, 10, .18);
      border: 2px solid rgb(176, 122, 0);
    }
    .sand-distance[hidden] { display: none; }
    #sand-distance-value { display: block; font-size: 30px; font-weight: 800; line-height: 1.05; color: var(--text); font-variant-numeric: tabular-nums; }
    #sand-distance-label { display: block; font-size: 11px; color: var(--muted); }
    .hazard-key { display: block; margin-top: 3px; font-size: 11px; font-weight: 500; opacity: .85; }
    .risk-head { display: flex; justify-content: space-between; color: var(--muted); }
    .risk-head strong { color: var(--text); }
    .risk-bar { height: 6px; margin: 6px 0; background: var(--line); border-radius: 3px; overflow: hidden; }
    .risk-bar span { display: block; height: 100%; background: var(--risk); transition: width .3s ease, background-color .3s ease; }
    #risk-cause { color: var(--muted); }

    /* ---- route options ---- */
    #route-options { display: grid; gap: 8px; margin: 10px 0 12px; }
    .route-card {
      display: grid;
      gap: 3px;
      position: relative;
      padding: 8px 10px 8px 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }
    .route-card:hover { border-color: var(--muted); }
    .route-card.is-selected { border-color: var(--accent); border-width: 2px; padding: 7px 9px 7px 29px; }
    .route-card input { position: absolute; left: 9px; top: 10px; margin: 0; }
    .route-head { display: flex; align-items: center; gap: 8px; }
    .badge {
      margin-left: auto;
      padding: 1px 7px;
      font-size: 11px;
      font-style: normal;
      color: var(--on-accent);
      background: var(--accent);
      border-radius: 10px;
    }
    .route-goal { color: var(--muted); font-size: 12px; }
    .route-stats { font-size: 12px; font-variant-numeric: tabular-nums; }
    .route-points { margin: 2px 0 0; padding: 0; list-style: none; font-size: 12px; }
    .route-points li { padding-left: 14px; position: relative; }
    .route-points li::before { position: absolute; left: 0; font-weight: 700; }
    .route-points .pro::before { content: "+"; color: var(--ok); }
    .route-points .con::before { content: "\2212"; color: var(--bad); }
    .recommend { margin: 0 0 10px; padding: 8px 10px; border-left: 3px solid var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); font-size: 12px; }
    .concerns { margin: 0; padding-left: 16px; font-size: 12px; }
    .concerns li { margin-bottom: 4px; }

    /* ---- rover panel ---- */
    #rover-panel.is-manual .auto-only, #rover-panel:not(.is-manual) .manual-only { display: none; }
    .full { width: 100%; margin: 10px 0 0; }
    .rover-row { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
    .rover-row button { flex: 1; white-space: nowrap; padding: 6px 6px; }
    .rover-row select { width: auto; }
    .rover-row .cam-modes { flex: 1; min-width: 0; }
    .rover-row .cam-modes button { padding: 6px 4px; font-size: 12px; }

    /* ---- minimap ---- */
    #minimap {
      position: fixed;
      left: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      width: 280px;
      padding: 8px;
      transition: width .2s ease;
    }
    #minimap.is-expanded { width: min(760px, calc(100vw - 360px)); }
    .map-toolbar { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; }
    .map-toolbar h2 { margin: 0 auto 0 2px; }
    .map-toolbar button { padding: 2px 8px; font-size: 12px; }
    #map-stage { position: relative; overflow: hidden; border-radius: 6px; }
    #map-zoom { position: relative; transform-origin: 0 0; }
    #map { display: block; width: 100%; height: auto; cursor: crosshair; }
    #map.is-zoomed { cursor: grab; }
    #map-fx { position: absolute; top: 0; left: 0; width: 100%; height: auto; pointer-events: none; }
    #rover-2d {
      position: absolute;
      width: 16px;
      height: 12px;
      pointer-events: none;
      background: #ffffff;
      clip-path: polygon(100% 50%, 0 0, 22% 50%, 0 100%);
      filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 1px #000);
    }
    #rover-2d[hidden] { display: none; }
    /* The astronaut on foot (drawn by walk.js). */
    #walker-2d {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #14100e;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #walker-2d[hidden] { display: none; }
    .walk-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .walk-legend[hidden] { display: none; }
    .walk-legend span.line::before { width: 16px; height: 4px; vertical-align: 2px; }
    /* Asked before setting off on a walk that crosses risky ground (walk.js). */
    #walk-confirm {
      max-width: 340px;
      width: calc(100% - 32px);
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
    }
    #walk-confirm::backdrop { background: rgba(5, 8, 12, .55); }
    #walk-confirm h2 { margin: 0 0 8px; font-size: 16px; color: var(--bad); }
    #walk-confirm p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; }
    #walk-confirm .button-row { margin-top: 14px; justify-content: flex-end; }
    button.danger { background: var(--bad); border-color: var(--bad); color: #ffffff; font-weight: 600; }
    .walk-status { margin: 4px 0 8px; font-size: 13px; font-weight: 600; }
    .walk-status:empty { display: none; }
    .walk-avoids { margin-top: 0; }
    .walk-legend span::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 2px;
      vertical-align: -1px;
      background: var(--swatch);
    }
    #walk-stats { margin-bottom: 8px; }
    #walk-stats:empty { display: none; }
    .walk-limits { font-size: 11px; margin-top: 8px; }
    /* Where the 3D camera stands and looks (drawn by ui.js). */
    #view-2d, .legend-view {
      background: linear-gradient(90deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .08));
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }
    #view-2d {
      position: absolute;
      width: 46px;
      height: 34px;
      pointer-events: none;
      transform-origin: 0 50%;
    }
    #view-2d[hidden] { display: none; }
    .legend-view { width: 16px; height: 12px; flex: none; outline: 1px solid rgba(0, 0, 0, .35); }
    #hover-readout {
      margin-top: 4px;
      min-height: 1.45em;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- drive pad (Ridgeback's) ---- */
    #pad {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 6px;
      touch-action: none;
      user-select: none;
    }
    #pad button { font-size: 20px; padding: 0; background: var(--panel); }
    #pad button:active { background: var(--accent); color: var(--on-accent); }
    #pad [data-drive="up"] { grid-column: 2; grid-row: 1; }
    #pad [data-drive="left"] { grid-column: 1; grid-row: 2; }
    #pad [data-drive="down"] { grid-column: 2; grid-row: 2; }
    #pad [data-drive="right"] { grid-column: 3; grid-row: 2; }

    #panels-toggle { display: none; }
    @media (max-width: 900px) {
      #hud-left { width: 250px; }
      #hud-right { display: none; top: 60px; }
      body.show-panels #hud-right { display: grid; }
      #panels-toggle { display: block; position: fixed; top: 12px; right: 12px; }
      #risk-hud { top: auto; bottom: 140px; }
      #minimap { width: 200px; }
      #minimap.is-expanded { width: calc(100vw - 24px); }
    }
    @media (max-width: 560px) {
      #hud-left { width: calc(100vw - 80px); max-height: 40vh; }
      #hud-right { left: 12px; width: auto; }
      #minimap { bottom: 140px; }
    }
  </style>
</head>
<body>
  <div id="world"></div>

  <div id="hud-left" class="column">
    <section id="rb-card" class="card" aria-live="polite">
      <h1 id="rb-name"></h1>
      <p class="tag" id="rb-tag"></p>
      <div class="row"><span id="rb-battery-label">Battery</span><span id="rb-pct">100%</span></div>
      <div class="bar"><div id="rb-fill" class="ok"></div></div>
      <p id="rb-status"></p>
      <p id="rb-limit"></p>
      <p id="rb-hint"></p>
      <div class="button-row" data-help="rover">
        <button id="rb-recharge" type="button"></button>
        <button id="rb-reset" type="button"></button>
      </div>
      <div class="learn">
        <details id="rb-limits-box" class="more">
          <summary id="rb-limits-title"></summary>
          <ul id="rb-limits"></ul>
        </details>
        <details id="rb-power-box" class="more">
          <summary id="rb-power-title"></summary>
          <div id="rb-power"></div>
        </details>
      </div>
    </section>

    <!-- Map layers and the legend. (Hazard limits are fixed now: Ridgeback's own.) -->
    <section id="layer-panel" class="card">
      <div id="layers-pane">
        <div class="tab-head" data-help="layers"><h2>What the map shows</h2></div>
        <div id="layer-list"></div>
        <div class="button-row"><button id="reset-layers" type="button">Reset layers</button></div>
        <div class="section">
          <div id="map-legend">
            <div id="map-legend-hazards"></div>
            <div id="map-legend-routes"></div>
          </div>
        </div>
        <div id="site-legend" class="section"></div>
      </div>
    </section>

    <details id="data-panel" class="card">
      <summary>Data &amp; sources</summary>
      <div id="data-sources"></div>
    </details>
  </div>

  <div id="risk-hud" hidden>
    <div class="risk-head">Ground risk <strong id="risk-level"></strong></div>
    <div class="risk-bar"><span id="risk-fill"></span></div>
    <div id="risk-cause"></div>
    <!-- Hazard Ridgeback is closing in on (rover.js), in that hazard's colour -->
    <div id="hazard-warning" role="status" aria-live="polite" hidden></div>
    <!-- Metres left before deep sand Ridgeback can't handle (rover.js) -->
    <div id="sand-distance" class="sand-distance" hidden>
      <span id="sand-distance-value"></span>
      <span id="sand-distance-label"></span>
    </div>
  </div>

  <!-- Walk or Drive? Opened by double-clicking the placed point (ui.js) -->
  <div id="choice-popup" class="card" role="dialog" aria-labelledby="choice-title" hidden>
    <button id="choice-close" type="button" aria-label="Close">&times;</button>
    <p id="choice-title"></p>
    <div class="button-row">
      <button id="choice-walk" type="button" class="primary"></button>
      <button id="choice-drive" type="button" class="primary"></button>
    </div>
    <button id="choice-delete" type="button" class="choice-delete"></button>
  </div>

  <!-- No route within the user's limits (rover.js) -->
  <dialog id="route-notice" class="app-dialog" aria-labelledby="route-notice-title">
    <h2 id="route-notice-title"></h2>
    <p id="route-notice-text"></p>
    <div class="button-row">
      <button id="route-notice-ok" type="button" class="primary"></button>
    </div>
  </dialog>

  <!-- Battery at 20%, 10% and 5% (rover.js); wording from content.js -->
  <div id="battery-warning" class="battery-warning" role="alert" hidden>
    <div class="battery-warning-text">
      <strong id="battery-warning-title"></strong>
      <span id="battery-warning-text"></span>
    </div>
    <button id="battery-warning-recharge" type="button" class="primary"></button>
    <button id="battery-warning-close" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Battery empty (rover.js); wording from content.js -->
  <div id="battery-alert" role="alert" hidden>
    <h2 id="battery-alert-title"></h2>
    <p id="battery-alert-text"></p>
    <button id="battery-alert-reset" type="button"></button>
  </div>

  <button id="panels-toggle" type="button" aria-expanded="false">Panels</button>

  <div id="hud-right" class="column">
    <!-- One panel at a time: the tabs open one <details> and close the rest. -->
    <div id="tabs" class="card" role="tablist" aria-label="Panels">
      <button type="button" role="tab" data-tab="route-panel">Plan</button>
      <button type="button" role="tab" data-tab="rover-panel">Drive</button>
      <button type="button" role="tab" data-tab="walk-panel">Walk</button>
      <button type="button" role="tab" data-tab="info-panel">Inspect</button>
    </div>

    <details id="route-panel" class="card" open>
      <summary>Plan</summary>
      <div class="tab-head" data-help="plan"><h2>Plan a route</h2></div>
      <div class="field-pair">
        <label class="field">Start <select id="route-from"></select></label>
        <label class="field">Destination <select id="route-to"></select></label>
      </div>
      <div class="button-row">
        <button id="route-clear" type="button" disabled></button>
      </div>
      <div id="route-options"></div>
      <div id="route-summary"></div>
    </details>

    <details id="info-panel" class="card">
      <summary>Inspect</summary>
      <div class="tab-head" data-help="inspect"><h2>Inspect a spot</h2></div>
      <div id="info-body"></div>
      <div class="button-row">
        <button id="clear-sample" type="button">Clear</button>
      </div>
    </details>

    <details id="rover-panel" class="card">
      <summary>Drive</summary>
      <div class="tab-head" data-help="drive"><h2>Drive Ridgeback</h2></div>
      <div class="toggle" role="group" aria-label="Driving mode">
        <button id="mode-auto" type="button" aria-pressed="true">Auto</button>
        <button id="mode-manual" type="button" aria-pressed="false">Manual</button>
      </div>
      <div class="auto-only">
        <div class="button-row">
          <button id="rover-play" type="button" class="primary"></button>
          <button id="rover-restart" type="button">Restart route</button>
        </div>
        <input id="rover-progress" class="full" type="range" min="0" max="1000" value="0" aria-label="Progress along route">
      </div>
      <p class="manual-only hint">W A S D / arrow keys, or hold the pad. Press Auto to plan a route from here.</p>
      <div class="rover-row" data-help="view">
        <div class="toggle cam-modes" role="group" aria-label="Camera view">
          <button id="cam-chase" type="button" aria-pressed="true">Chase cam</button>
          <button id="cam-first" type="button" aria-pressed="false">1st person</button>
        </div>
        <select id="rover-speed" aria-label="Simulation speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </div>
      <div id="rover-telemetry"></div>
    </details>

    <!-- Astronaut walk planner (walk.js); wording from content.js -->
    <details id="walk-panel" class="card">
      <summary>Walk</summary>
      <div class="tab-head" data-help="walk"><h2>Walk on foot</h2></div>
      <p id="walk-intro" class="hint"></p>
      <div id="walk-legend" class="walk-legend"></div>
      <p id="walk-status" class="walk-status" aria-live="polite"></p>
      <dl id="walk-stats"></dl>
      <p id="walk-avoids" class="hint walk-avoids"></p>
      <div class="button-row">
        <button id="walk-start" type="button" class="primary" disabled></button>
        <button id="walk-clear" type="button" disabled></button>
      </div>
      <details class="more">
        <summary id="walk-more-title"></summary>
        <label class="field"><span id="walk-site-label"></span><select id="walk-site"></select></label>
        <p id="walk-limits" class="hint walk-limits"></p>
      </details>
    </details>

  </div>

  <section id="minimap" class="card" aria-label="Minimap">
    <div class="map-toolbar" data-help="map">
      <h2>Map</h2>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="reset-view" type="button">Fit</button>
      <button id="map-expand" type="button" aria-pressed="false">Expand map</button>
    </div>
    <div id="map-stage">
      <div id="map-zoom">
        <canvas id="map" width="720" height="540"></canvas>
        <canvas id="map-fx" width="720" height="540" aria-hidden="true"></canvas>
        <div id="view-2d" hidden aria-hidden="true"></div>
        <div id="rover-2d" hidden aria-hidden="true"></div>
        <div id="walker-2d" hidden aria-hidden="true"></div>
      </div>
    </div>
    <div id="hover-readout"></div>
  </section>

  <div id="pad" aria-label="Drive controls">
    <button type="button" data-drive="up" aria-label="Drive forward">&#8593;</button>
    <button type="button" data-drive="left" aria-label="Turn left">&#8592;</button>
    <button type="button" data-drive="down" aria-label="Reverse">&#8595;</button>
    <button type="button" data-drive="right" aria-label="Turn right">&#8594;</button>
  </div>

  <!-- Walk warning (walk.js); wording from content.js -->
  <dialog id="walk-confirm" aria-labelledby="walk-confirm-title">
    <h2 id="walk-confirm-title"></h2>
    <p id="walk-confirm-body"></p>
    <p id="walk-confirm-advice" class="hint"></p>
    <div class="button-row">
      <button id="walk-confirm-cancel" type="button"></button>
      <button id="walk-confirm-go" type="button" class="danger"></button>
    </div>
  </dialog>

  <script>
    // Small screens: the right-hand panels open from a button.
    document.getElementById("panels-toggle").addEventListener("click", function () {
      var on = document.body.classList.toggle("show-panels");
      this.setAttribute("aria-expanded", String(on));
    });


    // Right-hand tabs: exactly one panel open at a time. Other scripts open a
    // panel by setting .open (e.g. "Plan routes here"), and the tabs follow.
    (function () {
      var tabs = [].slice.call(document.querySelectorAll("#tabs [data-tab]"));
      var panels = tabs.map(function (t) { return document.getElementById(t.getAttribute("data-tab")); });
      function show(id) {
        panels.forEach(function (p, i) {
          var on = p.id === id;
          if (p.open !== on) p.open = on;
          tabs[i].setAttribute("aria-selected", String(on));
          tabs[i].tabIndex = on ? 0 : -1;
        });
      }
      tabs.forEach(function (t, i) {
        t.addEventListener("click", function () { show(t.getAttribute("data-tab")); });
        t.addEventListener("keydown", function (e) {
          var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
          if (!d) return;
          var next = tabs[(i + d + tabs.length) % tabs.length];
          next.focus();
          next.click();
        });
      });
      panels.forEach(function (p) {
        p.addEventListener("toggle", function () { if (p.open) show(p.id); });
      });
      // Clicking the map or the ground doesn't change tab: each tab acts on
      // the click itself (Plan/Drive set the destination, Walk plans a walk,
      // Inspect shows the readings).
      show("route-panel");
    })();
  </script>
  <script type="module" src="help.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Real NASA/USGS data for Jezero crater (built by tools/build_jezero_data.py) -->
  <script src="data/jezero/jezero-data.js"></script>
  <script src="terrain.js"></script>
  <script src="data-layers.js"></script>
  <script src="ui.js"></script>
  <script src="rover.js"></script>
  <script src="walk-core.js"></script>
  <script src="walk.js"></script>
</body>
</html>
