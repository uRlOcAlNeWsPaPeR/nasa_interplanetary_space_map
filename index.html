<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interplanetary Survival Guide: Martian Map</title>
  <style>
    :root {
      --bg: #14100e;
      --panel: #211a17;
      --line: #3a2e28;
      --text: #f1e7df;
      --muted: #a8978b;
      --accent: #e0703a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header span { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 250px;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    aside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    aside h2 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #map-wrap { position: relative; }
    #map {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: crosshair;
    }
    #hover-readout {
      margin-top: 6px;
      min-height: 1.45em;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .layer-row, .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .layer-row input { accent-color: var(--accent); }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    #site-legend { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
    #info-body dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; }
    #info-body dt { color: var(--muted); }
    #info-body dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    #info-body .site { margin: 0 0 10px; font-weight: 600; }
    #info-body .empty { color: var(--muted); margin: 0; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Interplanetary Survival Guide: Martian Map</h1>
  </header>
  <main>
    <aside id="layer-panel">
      <h2>Layers</h2>
      <div id="layer-list"></div>
      <div id="site-legend"></div>
    </aside>
    <section id="map-wrap">
      <canvas id="map" width="720" height="540"></canvas>
      <div id="hover-readout"></div>
    </section>
    <aside id="info-panel">
      <h2>Sample</h2>
      <div id="info-body"></div>
    </aside>
  </main>
  <script src="mock-data.js"></script>
  <script src="ui.js"></script>
</body>
</html>
